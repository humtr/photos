[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "photo-organizer-v2"
version = "0.1.0"
description = "Photo Organizer v2 CLI core"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
exif = ["Pillow>=10"]

[project.scripts]
photos = "photos.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
