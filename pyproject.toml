[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "photos-triage"
version = "0.1.0"
description = "Safe local photo/video triage core with a Windows handoff scaffold."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "humetro15445005" }]
dependencies = []

[project.optional-dependencies]
gui = ["PySide6>=6.7"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
photos = "photos.gui:launch"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
