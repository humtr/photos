[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "photos-triage"
version = "0.2.0"
description = "Trusted local photo organizer with approval-gated Windows workflows."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "humetro15445005" }]
dependencies = []

[project.optional-dependencies]
gui = ["Pillow>=10"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
photos = "photos.cli:main"
photo-organizer = "photos.gui:launch"

[tool.setuptools]
package-dir = {"" = ".", photos = "src/photos"}
py-modules = ["photo_organizer_app"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
